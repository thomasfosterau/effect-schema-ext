name: CI

# One job, one required check: the task graph lives in vite.config.ts, not in
# `needs:`. Nothing here needs a database, a stage or a credential, so every
# PR runs the whole gate.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access. The job
# needs no secrets and no OIDC token, so a Dependabot PR runs it with nothing
# to leak. Every action is pinned to a full commit SHA (Dependabot's
# `github-actions` updates keep the pins current).
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Vite Task does not fingerprint the Node version, so the task cache is
      # keyed on it: otherwise a run on a new `latest` Node (#31) would replay
      # the previous Node's results for every task whose inputs are unchanged.
      # Also prints the resolved version in the step list.
      - name: Resolve the Node version
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Vite+ task cache (Node ${{ steps.node.outputs.version }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ steps.node.outputs.version }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ steps.node.outputs.version }}-
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type gates (src, type-level tests, emitted declarations)
        run: pnpm exec vp run --concurrency-limit 2 check
      - name: Unit tests
        run: pnpm exec vp run -r test:unit
      - name: Build
        run: pnpm exec vp run -r build
      # Type-checks AND runs every JSDoc @example against the built dist/.
      - name: Verify documentation examples (docgen)
        run: pnpm exec vp run docgen
      - name: Audit
        run: pnpm audit --audit-level high
