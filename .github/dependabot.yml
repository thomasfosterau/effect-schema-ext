# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace and its catalogs (pnpm-workspace.yaml), where every version lives.
#
# Groups collect the sets that MUST move together, so a lockstep set arrives
# as one PR instead of several that are each red on their own. Dependabot puts
# a dependency in the FIRST group that matches it, so the groups run specific
# -> general, and `exclude-patterns` keeps a package out of a broader group
# that would otherwise claim it.
#
# - `toolchain`: vite-plus pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries; `vite` is vite-plus's aliased core package;
#   `@vitest/coverage-istanbul` has an exact peer on `vitest`; and
#   `effect-tsgo patch` (the `prepare` script) hard-errors
#   (UnsupportedTargetPackageVersionError) on any `@typescript/native` /
#   oxlint pairing its `components` table does not list, failing
#   `pnpm install` itself. The Effect lint plugin (`@enfect/oxlint`) loads
#   inside that oxlint.
#   A toolchain PR whose `@effect/tsgo` does not yet support the new oxlint
#   goes red: fix it by hand on the PR (see the catalog comments in
#   pnpm-workspace.yaml) rather than merging part of the set.
# - `docgen`: `@effect/docgen` runs every example under `tsx`.
# - `effect`: the Effect 4 release line is a lockstep-versioned singleton
#   set. Only the dev pin moves: the published peer floor
#   (`catalogs.peers.effect`, a `>=` range) is a tested claim that Dependabot
#   has never rewritten (#60, #63), and it is never Dependabot's to move
#   (AGENTS.md, Common pitfalls).
# - `changesets`, `fallow`: their own sets.
# - `minor-and-patch`: everything else's minor and patch updates in one PR;
#   a major outside the sets above stays its own PR.
#
# By hand, never by Dependabot (it cannot rewrite them):
# - the npm-alias catalog entries: `vite`
#   (`npm:@voidzero-dev/vite-plus-core@<v>`, must equal `vite-plus`),
#   `typescript` (`npm:@typescript/typescript6@<v>`) and `@typescript/native`
#   (`npm:typescript@<v>`, must match `@effect/tsgo`'s components table).
#   Set them on the `toolchain` PR that moves their partner.
# - the `overrides` literals in pnpm-workspace.yaml (`undici`, a security
#   floor; drop it once nothing resolves below the fix) and the catalog's
#   `catalogs.peers` floor.
# - the npm version the Release workflow installs (`npm install -g npm@…`).
#
# `cooldown` waits 1 day, Dependabot's smallest unit (whole days only). That
# is longer than pnpm-workspace.yaml's `minimumReleaseAge` (480 minutes, 8
# hours), so a Dependabot PR never proposes a version pnpm would still refuse.
# It keeps the `@thomasfosterau/*` exemption pnpm has.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/oxlint"
          - "@oxlint/*"
          - "@voidzero-dev/*"
        update-types: ["major", "minor", "patch"]
      docgen:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["major", "minor", "patch"]
