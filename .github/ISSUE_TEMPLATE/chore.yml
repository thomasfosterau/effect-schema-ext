name: Chore
description: Tooling, CI, config, dependencies, or housekeeping.
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Non-feature maintenance. Routine dependency bumps are owned by Dependabot and usually don't need an issue — file one when a bump needs a code migration or coordination (the `@effect/tsgo` / `@typescript/native` / `vite-plus` trio, the `effect` peer floor).
  - type: textarea
    id: task
    attributes:
      label: Task
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
    validations:
      required: false
  - type: textarea
    id: done-when
    attributes:
      label: Done when
    validations:
      required: false
