# pnpm workspace — the published package under packages/* plus the
# dist-consumer declaration check under tests/*.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the preferenceflow application's catalog
# (the freshest of the three consuming applications) wherever the two overlap
# (effect, vite-plus, the TypeScript 6/7 pair, @effect/tsgo, the Effect oxlint
# plugin, fallow) — the apps consume this library, so the library builds
# against exactly what they run.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND executes every JSDoc `@example` in packages/*/src (the
  # `docgen` task). Its `typescript` peer (`^5`) resolves to the TS6 alias
  # below, which pnpm tolerates via `peerDependencyRules`; the JS API it uses
  # is unchanged in 6.
  "@effect/docgen": ^4.0.0
  "@effect/language-service": ^0.87.3
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below and with the `oxlint` that `vite-plus`
  # pulls in: 0.46.1 supports typescript 7.0.2 and oxlint 1.82.0 - 1.85.0, and
  # hard-errors (UnsupportedTargetPackageVersionError) on anything else —
  # failing `pnpm install` itself in the `prepare` script. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.47.1
  "@mpsuesser/oxlint-plugin-effect": ^0.6.0
  "@types/node": ^26.6.4
  # Must match `vitest` below (its peer is the exact vitest version).
  "@vitest/coverage-istanbul": 5.0.1
  effect: 4.0.0
  effect-solutions: ^0.5.3
  fallow: 3.31.0
  # `@effect/docgen` runs each example under tsx.
  tsx: ^4.23.13
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, @effect/docgen)
  # stay on TS6 while native `tsc` type-checks this library. The alias keeps
  # the package importable as `typescript` name-stable at the TS6 JS compiler
  # (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint `effect-tsgo patch --oxlint` has to support (see
  # the @effect/tsgo note above): 1.0.0 carries oxlint 1.85.0. `vite` is the
  # same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin (1.0.0 -> 5.0.1) because the `vitest: "catalog:"`
  # override forces every resolution to the catalog singleton.
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.115` peer would reject a consumer on rc.116). `pnpm pack` replaces
# `catalog:peers` with these ranges in the published manifest (see
# scripts/release.sh). The floor is the oldest `effect` the package has been
# type-checked and tested against (rc.118, the line the whole programme moved to in website#2015).
catalogs:
  peers:
    effect: ">=4.0.0-rc.118"

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # @mpsuesser/oxlint-plugin-effect@0.5.0 depends on effect 4.0.0-beta.100 and calls
  # `Schema.isIncludes` at load, which rc.118 renamed to `isIncluding`; forced onto the
  # singleton rc.118 it throws and `vite.config.ts` cannot load. This gives the lint
  # plugin its own private copy. Remove once the plugin ships a release built on
  # effect rc.118 or later (owner-approved, thomasfosterau/effect-schema-ext#11).
  "@mpsuesser/oxlint-plugin-effect>effect": "4.0.0-beta.100"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  # Only reached through the lint plugin's private effect beta copy (see the override
  # above); msgpackr falls back to pure JS without the native addon.
  msgpackr-extract: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
    # @effect/docgen declares `typescript: ^5`; the workspace's `typescript`
    # is the TS6 alias (see the catalog note).
    - typescript
  allowedVersions:
    vite: "*"
    vitest: "*"
    typescript: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
